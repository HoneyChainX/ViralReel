    ref: main
    profile: core
    role: "Blender as a Python module (bpy) — the actual 3D stage: scene assembly, layout, Cycles CPU rendering, USD/glTF IO, all headless"
    license: GPL-3.0
    cost: free
    gpu: none
    headless: true
    install: script
    install_cmd: "${VIRALREEL_PY311:-python3.11} -m venv .venv && .venv/bin/pip install bpy"
    # bpy publishes cp311 wheels ONLY — not 3.10, not 3.12. Ubuntu 24.04 ships
    # 3.12, so building this venv with a bare `python3` fails with "no matching
    # distribution" and takes the entire 3D lane down. install/wsl/bootstrap.sh
    # provides the interpreter and exports VIRALREEL_PY311.
    enabled: true
    doctor:
      - { type: cmd, run: "vendor/blender-headless/.venv/bin/python -c 'import bpy; print(bpy.app.version_string)'" }
    notes: >
      Supersedes 'no 3D stage exists' (docs/11 §9): the pip bpy wheel gives full Blender
      headless — previs blocking, procedural scenes, Cycles CPU renders — on this host
      today. GPL is fine (tool, not linked library). The desktop `blender` module remains
      the human-authoring seat; this is the agents' seat.

