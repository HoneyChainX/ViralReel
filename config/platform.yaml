# Studio platform manifest — the single source of truth for every integrated repo.
#
# Managed by scripts/studio/platform.py (list | install | doctor) and the
# `platform-install` ralph loop. Vendors are cloned to vendor/<id>, never forked
# or patched — configuration happens from outside (the scripts/setup.sh contract).
#
# Doctrine (docs/10-platform.md, DECISIONS D8):
#   * cost: paid  modules MUST ship enabled: false. The manifest loader hard-fails
#     otherwise. Paid connectors are per-project founder decisions, never defaults.
#   * install: desktop modules are human-installed authoring tools; the installer
#     skips them and the doctor doesn't gate on them.
#   * refs are `main` until the platform-install loop completes a verified install,
#     at which point it pins the exact SHA it verified.
#
# Identification research (licenses, VRAM, maintenance, fuzzy-name resolution):
# docs/11-platform-research.md.

version: 1
default_profile: core

profiles:
  core:         "Provenance pipeline — what Price Archaeology ships on today. $0, no GPU."
  distribution: "Publish, schedule, SEO, analytics."
  genai:        "Local open-weights generation engines. GPU host. Off for provenance channels."
  animation:    "2D/3D animation + drama pipelines. Mostly human-in-the-loop authoring tools."
  voice:        "Speech: transcription, alignment, TTS beyond ElevenLabs."
  audio:        "Sound design: foley + music generation. Music is FORBIDDEN on Price Archaeology (D5)."

