# /etc/wsl.conf — per-distro settings, applied by install/windows/bootstrap.ps1.
#
# Copy to /etc/wsl.conf INSIDE the distro, then from Windows run `wsl --shutdown`
# and reopen it. Nothing here takes effect until that restart.

[boot]
# Without this there is no systemd, and without systemd the render worker is
# just a process someone started once. This single line is what makes the box a
# server rather than a workstation with a terminal open.
systemd=true

[automount]
enabled=true
mountFsTab=true
root=/mnt/
# metadata lets Linux permissions survive on mounted Windows drives. The repo
# must still live on the Linux filesystem — see the note in bootstrap.sh — but
# without this, anything touched under /mnt has unusable modes.
options="metadata,umask=22,fmask=11"

[interop]
enabled=true
# Keep the Windows PATH out of Linux builds. With it appended, a stray
# python.exe or node.exe from Windows can win a PATH lookup inside a build and
# produce failures that make no sense from the Linux side.
appendWindowsPath=false

[network]
hostname=renderbox
generateHosts=true
generateResolvConf=true

[gpu]
# Harmless with no NVIDIA card; required for the GPU lane (docs/14) with one.
enabled=true

[time]
useWindowsTimezone=true
